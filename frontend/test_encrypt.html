<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Encryption Test Page</title>
<style>
  body { background: #111; color: #eee; font-family: Arial, sans-serif; padding: 40px; }
  h1 { color: #38bdf8; }
  .box { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 24px; margin: 20px 0; max-width: 600px; }
  label { display: block; font-weight: bold; margin: 12px 0 4px; color: #94a3b8; font-size: 14px; }
  input, textarea { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #475569; background: #0f172a; color: #f8fafc; font-size: 14px; box-sizing: border-box; }
  textarea { height: 80px; resize: vertical; }
  button { padding: 12px 24px; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 16px; }
  #btn-encrypt { background: #f97316; color: #fff; }
  #btn-encrypt:hover { background: #ea580c; }
  #btn-encrypt:disabled { background: #555; cursor: wait; }
  #status { margin-top: 16px; padding: 16px; border-radius: 8px; font-size: 14px; white-space: pre-wrap; display: none; }
  #status.success { display: block; background: rgba(34,197,94,0.15); border: 1px solid #22c55e; color: #22c55e; }
  #status.error { display: block; background: rgba(239,68,68,0.15); border: 1px solid #ef4444; color: #ef4444; }
  #status.info { display: block; background: rgba(56,189,248,0.15); border: 1px solid #38bdf8; color: #38bdf8; }
  #download-area { display: none; text-align: center; margin-top: 20px; }
  #download-area a { display: inline-block; padding: 16px 32px; background: #22c55e; color: #fff; border-radius: 10px; font-weight: bold; font-size: 18px; text-decoration: none; }
  #download-area a:hover { background: #16a34a; }
</style>
</head>
<body>
<h1>🔒 Encryption Test Page</h1>
<p>This page directly tests the backend AES-256-GCM encryption API. No app.js involved.</p>

<div class="box">
  <label>CSV Data (pre-filled with your sample):</label>
  <textarea id="csv-data">Name,IP,Port,Username,Password,Site
Sonicwall,192.168.1.12,22,admin,password,Headquarters
Cloned Sonicwall,192.168.1.14,22,admin,password,Office</textarea>

  <label>Passphrase (min 8 characters):</label>
  <input type="password" id="passphrase" value="TestPass123!" placeholder="Enter passphrase...">

  <button id="btn-encrypt" onclick="doEncrypt()">🔒 Encrypt Now</button>
</div>

<div id="status"></div>

<div id="download-area">
  <p style="color:#94a3b8; margin-bottom:12px;">Your encrypted file is ready:</p>
  <a id="download-link" href="#" download="test_encrypted.enc">⬇️ DOWNLOAD .enc FILE</a>
</div>

<script>
function log(msg, type) {
  const el = document.getElementById('status');
  el.className = type;
  el.textContent = msg;
}

async function doEncrypt() {
  const csv = document.getElementById('csv-data').value.trim();
  const pass = document.getElementById('passphrase').value.trim();
  const btn = document.getElementById('btn-encrypt');

  if (!csv) { log('ERROR: CSV data is empty!', 'error'); return; }
  if (!pass || pass.length < 8) { log('ERROR: Passphrase must be at least 8 characters!', 'error'); return; }

  log('Step 1: Sending request to backend...', 'info');
  btn.disabled = true;
  btn.textContent = 'Encrypting...';

  try {
    const apiBase = window.location.origin + '/api';
    log('Step 1: Calling ' + apiBase + '/export-enc ...', 'info');

    const res = await fetch(apiBase + '/export-enc', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        csv_text: csv,
        passphrase: pass,
        filename: 'test_firewalls.csv'
      })
    });

    log('Step 2: Got HTTP ' + res.status + ' response...', 'info');

    if (!res.ok) {
      let errMsg = 'HTTP ' + res.status;
      try { const j = await res.json(); errMsg = j.error || errMsg; } catch(e) {}
      throw new Error(errMsg);
    }

    const blob = await res.blob();
    log('Step 3: Received ' + blob.size + ' bytes encrypted blob...', 'info');

    const url = window.URL.createObjectURL(blob);
    const dlLink = document.getElementById('download-link');
    dlLink.href = url;
    dlLink.download = 'test_firewalls_encrypted.enc';
    document.getElementById('download-area').style.display = 'block';

    // Also try auto-download
    const a = document.createElement('a');
    a.href = url;
    a.download = 'test_firewalls_encrypted.enc';
    a.style.display = 'none';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);

    log('✅ SUCCESS! Encrypted ' + blob.size + ' bytes.\nIf auto-download did not work, click the green button below.', 'success');

  } catch (err) {
    log('❌ FAILED: ' + err.message + '\n\nThis means the backend server is NOT running or NOT reachable.\nMake sure to start the server: python backend/app.py', 'error');
  }

  btn.disabled = false;
  btn.textContent = '🔒 Encrypt Now';
}
</script>
</body>
</html>
